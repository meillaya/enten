name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+asyncpg://enten:enten@localhost:5433/enten
  GITHUB_APP_ID: "0"
  GITHUB_WEBHOOK_SECRET: stub-webhook-secret
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: enten
          POSTGRES_PASSWORD: enten
          POSTGRES_DB: enten
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U enten -d enten"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.10.4"
          enable-cache: true
      - name: Sync Python dependencies
        run: uv sync --project packages/python/enten --all-groups --locked
      - name: Install gitleaks 8.30.1
        run: |
          install_dir="$(mktemp -d)"
          trap 'rm -rf "$install_dir"' EXIT
          archive="$install_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$install_dir" gitleaks
          sudo install -m 0755 "$install_dir/gitleaks" /usr/local/bin/gitleaks
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"
      - name: Ruff 0.15.18
        run: uvx --from ruff==0.15.18 ruff check .
      - name: Python tests and coverage
        run: ENTEN_COVERAGE_SCOPE=python bash scripts/check-coverage.sh
      - name: Permission policy
        if: matrix.python-version == '3.12'
        run: make permissions
      - name: Upload Python reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-reports-${{ matrix.python-version }}
          path: /tmp/enten-coverage
          retention-days: 7
          if-no-files-found: error

  python-eval-smoke:
    name: python eval smoke
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.10.4"
          enable-cache: true
      - name: Sync Python dependencies
        run: uv sync --project packages/python/enten --all-groups --locked
      - name: Run three-fixture eval
        run: >-
          uv run --project packages/python/enten enten eval
          --corpus tests/fixtures/prs/smoke
          --report /tmp/enten-eval-smoke.json
          --stub-llm
      - name: Enforce eval thresholds
        env:
          EVAL_PRECISION_MIN: ${{ vars.EVAL_PRECISION_MIN || '0.5' }}
          EVAL_RECALL_MIN: ${{ vars.EVAL_RECALL_MIN || '0.5' }}
          EVAL_FPR_MAX: ${{ vars.EVAL_FPR_MAX || '0.5' }}
        run: uv run scripts/eval-threshold-check.py /tmp/enten-eval-smoke.json
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-smoke-report
          path: /tmp/enten-eval-smoke.json
          retention-days: 7
          if-no-files-found: error

  typescript:
    name: typescript node 22
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: enten
          POSTGRES_PASSWORD: enten
          POSTGRES_DB: enten
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U enten -d enten"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: make typecheck
      - name: Build
        run: make build
      - name: Test
        run: make test-ts
      - name: Coverage
        run: ENTEN_COVERAGE_SCOPE=typescript bash scripts/check-coverage.sh
      - name: Dependency audit
        run: pnpm audit --audit-level=low
      - name: Upload TypeScript coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typescript-coverage
          path: packages/ts/app/coverage
          retention-days: 7
          if-no-files-found: error

  release-secrets:
    name: release secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          install_dir="$(mktemp -d)"
          trap 'rm -rf "$install_dir"' EXIT
          archive="$install_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$install_dir" gitleaks
          sudo install -m 0755 "$install_dir/gitleaks" /usr/local/bin/gitleaks
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"
      - name: Scan history and release archive
        run: make security
