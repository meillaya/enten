packages:
  - "packages/ts/*"

# Pnpm 11 enforces an allowlist for post-install build scripts. We opt in
# to the well-known safe packages the TypeScript toolchain depends on
# (esbuild for vitest, protobufjs for the Octokit wire format).
allowBuilds:
  esbuild: true
  protobufjs: true
  msw: true

# Transitive packages with published advisories. Keep these pinned until the
# parent dependency ranges include the patched release.
overrides:
  "@grpc/grpc-js": "^1.14.5"
  "brace-expansion@>=2.0.0 <2.1.7": "2.1.7"
  systeminformation: "^5.33.16"
