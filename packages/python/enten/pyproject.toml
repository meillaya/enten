[project]
name = "enten"
version = "0.1.0"
description = "enten - AI engineering agent (Python core)"
readme = "../../../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "enten contributors" },
]
keywords = ["ai", "agent", "engineering", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "python-json-logger>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-exporter-otlp>=1.43.0",
    "opentelemetry-instrumentation-httpx>=0.64b0",
    "opentelemetry-instrumentation-asyncio>=0.64b0",
    "opentelemetry-instrumentation-asyncpg>=0.64b0",
    "prometheus-client>=0.25.0",
    "docker>=7.2.0",
    "tree-sitter==0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.13.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Filled in by T05 (config), T08 (db), etc. Keep empty for the scaffold.
dev = []
# T06 — pytest suite.
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "testcontainers[postgres]>=4.0",
    "httpx>=0.27",
    "respx>=0.21",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "asyncpg>=0.29",
]

[project.scripts]
enten = "enten.cli:app"

[project.urls]
"Homepage" = "https://github.com/enten/enten"
"Issues" = "https://github.com/enten/enten/issues"

# ─── Hatch build backend ────────────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enten"]

# ─── Pytest configuration (consumed by `uv run pytest` in this package) ──
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

# ─── Ruff configuration (inherits from root, can be overridden here) ───
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["UP042"]

[tool.pyright]
venvPath = "../../.."
venv = ".venv"

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
]
