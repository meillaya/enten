name: enten-bot
url: https://github.com/enten/enten
hook_attributes:
  url: $RENDER_EXTERNAL_URL/webhook
  active: true
redirect_url: https://github.com/enten/enten
public: false
default_events:
  - pull_request
  - pull_request_review
  - issue_comment
default_permissions:
  pull_requests: write
  checks: write
  metadata: read
