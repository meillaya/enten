app = "enten-ai"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "python -m enten.migrations apply --baseline-existing"

[processes]
  web = "node packages/ts/app/dist/server.js"
  worker = "enten worker"

[env]
  OTEL_EXPORTER_OTLP_ENDPOINT = "http://otel-collector.internal:4317"
  PORT = "3000"
  METRICS_PORT = "9091"

[[services]]
  processes = ["web"]
  internal_port = 3000
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/health"
    port = 3000

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
