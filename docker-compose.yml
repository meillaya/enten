name: enten

x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://enten:enten@postgres:5432/enten
  GITHUB_APP_ID: "${GITHUB_APP_ID:-1}"
  GITHUB_APP_SLUG: "${GITHUB_APP_SLUG:-enten-bot}"
  GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-local-development-only}"
  SANDBOX_DOCKER_IMAGE: "${SANDBOX_DOCKER_IMAGE:-}"
  VERIFICATION_COMMAND: "${VERIFICATION_COMMAND:-python -m compileall -q .}"
  OTEL_ENDPOINT: http://jaeger:4317
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  OTEL_SERVICE_NAME: enten

x-app-service: &app-service
  image: enten:local
  build:
    context: .
  environment: *app-environment
  init: true

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    restart: unless-stopped
    environment:
      POSTGRES_USER: enten
      POSTGRES_PASSWORD: enten
      POSTGRES_DB: enten
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enten -d enten"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.19.0@sha256:ede4864215be4cd85bd8c3129a2fea6c5713c5653c7282c429dba123014bc68b
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JAEGER_UI_HOST_PORT:-16686}:16686"
      - "127.0.0.1:${OTLP_GRPC_HOST_PORT:-14317}:4317"
      - "127.0.0.1:${OTLP_HTTP_HOST_PORT:-14318}:4318"

  migrate:
    <<: *app-service
    command: ["python", "-m", "enten.migrations", "apply", "--baseline-existing"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app-service
    command: ["node", "packages/ts/app/dist/server.js"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
      - "127.0.0.1:${WEB_METRICS_HOST_PORT:-9091}:9091"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "/app/health.py"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    <<: *app-service
    command: ["enten", "worker"]
    environment:
      <<: *app-environment
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
    group_add:
      - "${DOCKER_GID:-0}"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${GITHUB_APP_PRIVATE_KEY_PATH:-./secrets/github-app.pem}"
        target: /run/secrets/github-app.pem
        read_only: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama@sha256:57f573b47f1f71ebb445789f279fe3e596a8beab182f7cf486db9205bad87c5a
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  pgdata:
  ollama-data:
